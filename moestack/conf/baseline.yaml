# Baseline MoE pretraining (moestack). Defaults reproduce imbalance_train.py's
# baseline cell (deepseek-tiny, Muon, aux 0.01, z 1e-4) -- see moestack/README.md.
# Override anything on the CLI:  python -m moestack.train loss.aux_coef=0 train.seed=1
# Every field of moestack/config.py is overridable (the dataclasses are the schema).

defaults:
  - moestack_schema
  - _self_

model:
  arch: deepseek          # deepseek | olmoe | qwen3moe
  scale: tiny             # tiny | small | regular (width only; depth fixed per arch)
  experts_impl: grouped_mm

loss:
  aux_coef: 0.01          # load balancing; 0 = no balancing pressure
  z_coef: 1.0e-4          # router z-loss

optim:
  name: muon              # muon (Muon for matrices + AdamW for the rest) | adamw
  lr: 0.02
  min_lr_ratio: 0.1
  warmup_steps: 100
  grad_clip: 1.0
  # Per-expert learning rates. Off by default: alpha=0 with freeze_dead=false
  # makes every multiplier exactly 1.0 and the run is the plain baseline.
  #   optim.per_expert_lr.alpha=0.5        lr_e proportional to sqrt(token share)
  #   optim.per_expert_lr.freeze_dead=true zero-token experts take no step at all
  per_expert_lr:
    alpha: 0.0
    freeze_dead: false
    ema: 0.9              # smoothing of the counts the rule reads; 0 = raw counts
    normalize: true       # keep the mean rate over alive experts at 1.0
    clamp_min: 1.0e-3
    clamp_max: 10.0

parallel:
  dp: -1                  # -1 = all ranks
  ep: 1                   # >1 not implemented yet (fails loudly)
  tp: 1
  compile: false
  activation_checkpointing: false
  mixed_precision: bf16

data:
  # disk = the pre-tokenized cache (see moestack/prepare_data.py). Same sequences
  # as `stream`, but read from a memmap: no 5-50 min shuffle-buffer fill, no
  # DataLoader workers to hang mid-run, and resume seeks instead of replaying.
  # 1.16B tokens = 2,211 steps at 16x16x2048; past that it wraps to a 2nd epoch.
  # Use source=stream to go back to the Hub, source=synthetic for smoke tests.
  source: disk            # stream | disk | synthetic
  cache_dir: /mloscratch/homes/anagupta/data/dclm-fp-1.2B
  seq_len: 2048
  batch_size: 16          # per rank
  grad_accum: 16
  num_workers: 4          # stream only; disk needs no workers
  eval_batches: 10

train:
  n_steps: 2000
  seed: 42
  log_every: 10
  eval_every: 500
  save_every: 500
  save_dir: checkpoints
  auto_resume: false
  dry_run: false

logging:
  wandb: true
  project: moe-baseline
  tag: null
  load_stats: true
  # 4 x n_layers extra series under `load_layer/`; on only when you are
  # actually asking how imbalance varies with depth.
  load_stats_per_layer: false
  # Per-expert JSONL + drift/* correlations every N steps (0 = off). The file is
  # <save_dir>/<run_name>_expert_stats.jsonl; wandb gets only the aggregates.
  expert_stats_every: 0

hydra:
  job:
    chdir: false
  run:
    dir: ${train.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
